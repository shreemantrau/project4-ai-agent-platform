apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaler
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
    - type: azure-queue
      metadata:
        queueName: jobs
        queueLength: "2"
        connectionFromEnv: QUEUE_CONNECTION_STRING