# Service: a stable address in front of the api pods. Pod IPs change on every. Consider it as a Load Balancer.
#          LB will have an IP of its own no matter what happens to the VM behind it. Traffic hits the IP of the LB.
# restart or update; this address does not.
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  # Finds pods by label. Must match the pod labels in the Deployment template.
  selector:
    app: api
  ports:
  - port: 80          # port callers use on the Service
    targetPort: 5000  # port the app listens on inside the pod